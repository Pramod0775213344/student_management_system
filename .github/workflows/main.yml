name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Backend - Install Dependencies
      run: |
        cd backend
        npm install

    - name: Frontend - Install Dependencies and Build
      run: |
        cd frontend
        npm install
        npm run build # Verify that frontend builds correctly
      env:
        VITE_API_BASE_URL: http://localhost:5000 # Placeholder for build check

    - name: Verify Docker Compose config
      run: docker compose config
